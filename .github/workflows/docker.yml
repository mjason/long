name: Docker image

# Build the Docker image (with Deno + Obscura baked in, see ./Dockerfile)
# and push it to GitHub Container Registry. Runs on version tags — so a
# `v0.3.2` tag publishes `ghcr.io/<owner>/long:0.3.2`, `:0.3`, and
# `:latest` — and can also be triggered by hand for a one-off `:latest`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: build + push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # version tags (0.3.2, 0.3) only fire on a v* tag; latest always.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The Dockerfile pins x86_64 Deno/Obscura assets, so amd64 only.
          # Add arm64 here once the Dockerfile selects assets by TARGETARCH.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
