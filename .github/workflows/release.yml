name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version to bake into the artifact name (no leading v)"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      MIX_ENV: prod
      ELIXIR_VERSION: "1.19.5"
      OTP_VERSION: "28.1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-latest
            install: brew
          # Build on 22.04 (glibc 2.35), not 24.04 (glibc 2.39): glibc is
          # forward-compatible only, so a binary built against 2.35 runs on
          # Debian 12 (2.36) and every newer distro. Building on 24.04 made
          # the release refuse to start on anything older than Ubuntu 24.04.
          - target: linux-x64
            runner: ubuntu-22.04
            install: setup-beam
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            install: setup-beam

    steps:
      - uses: actions/checkout@v4

      # macOS: brew install. setup-beam doesn't support arm64 macOS yet.
      - name: Install Erlang & Elixir (Homebrew)
        if: matrix.install == 'brew'
        run: |
          brew install erlang elixir
          mix local.hex --force
          mix local.rebar --force

      # Linux: setup-beam is faster + caches. Pinned to v1.24.0 — the
      # floating @v1 didn't recognise the GitHub arm64 runner's
      # ImageOS=ubuntu22-arm64 and failed `linux-arm64`. v1.24 maps it and
      # pulls the arm64 precompiled OTP (builds.hex.pm has ubuntu-22.04 arm64).
      - name: Install Erlang & Elixir (setup-beam)
        if: matrix.install == 'setup-beam'
        # GitHub's ubuntu-22.04-arm runner sets ImageOS=ubuntu22-arm64, which
        # setup-beam's OS map doesn't recognise (it accepts ubuntu22/ubuntu24).
        # Force the OS hint; setup-beam detects the arm64 arch itself and pulls
        # the matching precompiled OTP. No-op on the x64 runner (already ubuntu22).
        env:
          ImageOS: ubuntu22
        uses: erlef/setup-beam@v1.24.0
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build/prod
          key: ${{ matrix.target }}-prod-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ matrix.target }}-prod-

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Compile dependencies
        run: mix deps.compile

      - name: Compile application
        # Compiles colocated `phoenix-colocated/long` hooks that esbuild
        # imports in `mix assets.deploy` below.
        run: mix compile

      - name: Setup assets
        run: mix assets.setup

      - name: Build assets
        run: mix assets.deploy

      - name: Build release
        run: mix release

      # macOS only: the crypto NIF links Homebrew's openssl@3 by absolute
      # path, so the "self-contained" tarball won't start on a Mac without
      # Homebrew. Bundle the openssl dylibs into the release and rewrite the
      # links to @loader_path, then re-sign (arm64 macOS rejects unsigned /
      # tampered Mach-O on dlopen).
      - name: Bundle OpenSSL into the macOS release
        if: matrix.install == 'brew'
        run: |
          set -euo pipefail
          REL=_build/prod/rel/long
          CRYPTO=$(find "$REL" -name crypto.so | head -1)
          [ -n "$CRYPTO" ] || { echo "crypto.so not found"; exit 1; }
          LIBDIR=$(dirname "$CRYPTO")
          echo "crypto.so: $CRYPTO"
          otool -L "$CRYPTO"

          # Copy each Homebrew openssl dylib the NIF references into the NIF's
          # own dir and repoint the link to @loader_path.
          for dep in $(otool -L "$CRYPTO" | awk '/opt\/homebrew.*lib(crypto|ssl).*\.dylib/{print $1}'); do
            base=$(basename "$dep")
            cp -f "$dep" "$LIBDIR/$base"
            chmod u+w "$LIBDIR/$base"
            install_name_tool -id "@loader_path/$base" "$LIBDIR/$base"
            install_name_tool -change "$dep" "@loader_path/$base" "$CRYPTO"
          done

          # libssl depends on libcrypto — rewrite inter-dylib refs too.
          for lib in "$LIBDIR"/libssl*.dylib "$LIBDIR"/libcrypto*.dylib; do
            [ -e "$lib" ] || continue
            for dep in $(otool -L "$lib" | awk '/opt\/homebrew.*lib(crypto|ssl).*\.dylib/{print $1}'); do
              install_name_tool -change "$dep" "@loader_path/$(basename "$dep")" "$lib"
            done
          done

          # Re-sign the rewritten Mach-O (ad-hoc) so dlopen accepts them.
          for f in "$CRYPTO" "$LIBDIR"/libssl*.dylib "$LIBDIR"/libcrypto*.dylib; do
            [ -e "$f" ] || continue
            codesign --force --sign - "$f"
          done

          echo "=== after ==="; otool -L "$CRYPTO"

      - name: Package tarball
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.tag || 'dev' }}-$(git rev-parse --short HEAD)"
          fi

          TARBALL="long-${VERSION}-${{ matrix.target }}.tar.gz"
          cd _build/prod/rel
          tar czf "../../../${TARBALL}" long
          cd ../../..

          echo "TARBALL=${TARBALL}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          ls -lh "${TARBALL}"

      - name: Upload to GitHub Releases (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TARBALL }}
          generate_release_notes: true
          # Tags with a `-` suffix (e.g. v0.1.0-rc1, v1.0.0-beta) are
          # prereleases; clean semver (v1.2.3) is a regular release.
          prerelease: ${{ contains(github.ref, '-') }}

      - name: Upload build artifact (manual run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: long-${{ env.VERSION }}-${{ matrix.target }}
          path: ${{ env.TARBALL }}
